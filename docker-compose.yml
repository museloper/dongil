services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dongil
      POSTGRES_PASSWORD: dongil
      POSTGRES_DB: dongil
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongil -d dongil"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod"]
    restart: unless-stopped
    # JWT_ACCESS_SECRET, JWT_REFRESH_SECRET 은 루트 .env 에서 읽는다 (없으면 prod 실행 거부)
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dongil:dongil@db:5432/dongil
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
